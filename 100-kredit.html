<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1226">
<title>100 Kredit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1226; --bg2:#0f1a36; --card:#14214a; --card-hi:#1a2b5e;
  --line:rgba(243,234,214,.12); --line-hi:rgba(243,234,214,.22);
  --cream:#f3ead6; --muted:#a3adc8; --dim:#6f7a98;
  --gold:#e4b95f; --gold-soft:rgba(228,185,95,.14); --gold-line:rgba(228,185,95,.55);
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--sans); color:var(--cream); background:var(--bg);
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(228,185,95,.13), transparent 60%),
    radial-gradient(90% 50% at 100% 100%, rgba(70,100,200,.16), transparent 60%),
    linear-gradient(180deg, var(--bg2), var(--bg));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  font-size:17px; line-height:1.6;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.screen{flex:1;display:flex;flex-direction:column;animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:14px;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:15px;transition:transform .15s, background .2s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(180deg,#f0c873,#d9a845);color:#1a1405;box-shadow:0 8px 28px rgba(228,185,95,.22)}
.btn-ghost{border:1px solid var(--line-hi);color:var(--cream);letter-spacing:.12em}
.btn + .btn{margin-top:12px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);flex-shrink:0}
.icon-btn span{display:block;width:4px;height:4px;border-radius:50%;background:var(--cream);box-shadow:0 -7px 0 var(--cream),0 7px 0 var(--cream)}

/* ---------- landing ---------- */
.landing{justify-content:center;text-align:center;padding:40px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;font-weight:600}
.logo{font-family:var(--serif);font-weight:700;font-size:clamp(64px,22vw,96px);line-height:.9;letter-spacing:-.02em;margin:18px 0 6px}
.logo small{display:block;font-family:var(--sans);font-size:15px;letter-spacing:.5em;font-weight:600;color:var(--gold);margin-top:14px;padding-left:.5em}
.tagline{font-family:var(--serif);font-size:24px;line-height:1.3;color:var(--cream);margin:28px auto 0;max-width:310px;font-style:italic;font-weight:500}
.coin{width:86px;height:86px;margin:0 auto;border-radius:50%;border:1px solid var(--gold-line);display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(228,185,95,.25),transparent 65%);position:relative}
.coin::after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px dashed rgba(228,185,95,.35)}
.coin b{font-family:var(--serif);font-size:30px;color:var(--gold)}
.intro-copy{margin:34px auto 0;max-width:330px;color:var(--muted);font-size:16.5px}
.intro-copy p + p{margin-top:14px}
.intro-copy strong{color:var(--cream);font-weight:600}
.landing-actions{margin-top:auto;padding-top:36px}
.fine{font-size:13.5px;color:var(--dim);margin-top:16px;text-align:center}

/* ---------- setup ---------- */
.setup{padding-top:48px}
.setup h2{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1.2}
.field-label{display:block;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:34px 0 10px;font-weight:600}
.name-input{width:100%;min-height:58px;border-radius:14px;border:1px solid var(--line-hi);background:rgba(10,18,38,.6);
  color:var(--cream);font:inherit;font-size:20px;padding:0 18px;outline:none;transition:border-color .2s}
.name-input:focus{border-color:var(--gold-line)}
.name-input::placeholder{color:var(--dim)}
.credit-hero{margin:40px 0 0;padding:26px;border-radius:20px;border:1px solid var(--line);background:rgba(20,33,74,.5);text-align:center}
.credit-hero .lbl{font-size:12px;letter-spacing:.32em;color:var(--gold);font-weight:600}
.credit-hero .num{font-family:var(--serif);font-size:72px;line-height:1;margin-top:8px;font-weight:700}
.credit-hero .sub{font-size:14px;color:var(--muted);margin-top:10px}
.week-lines{margin:34px 0 0;font-family:var(--serif);font-size:23px;line-height:1.45;font-weight:500}
.week-lines span{display:block}
.week-lines span:last-child{color:var(--gold);font-style:italic}

/* ---------- game header ---------- */
.hud{position:sticky;top:0;z-index:5;margin:0 -18px;padding:calc(10px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(10,18,38,.96) 70%,rgba(10,18,38,0));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud-mid{flex:1;min-width:0}
.hud-story{font-size:12.5px;letter-spacing:.2em;font-weight:700;color:var(--muted)}
.hud-story b{color:var(--cream)}
.dots{display:flex;gap:4px;margin-top:7px}
.dots i{flex:1;height:4px;border-radius:2px;background:rgba(243,234,214,.12)}
.dots i.on{background:var(--gold)}
.dots i.now{background:linear-gradient(90deg,var(--gold),rgba(228,185,95,.35))}

/* ---------- story ---------- */
.story{padding-top:8px}
.when{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.2em;font-weight:700;color:var(--gold);
  border:1px solid var(--gold-line);border-radius:999px;padding:6px 12px;align-self:flex-start}
.when::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.story-title{font-family:var(--serif);font-size:30px;line-height:1.15;font-weight:500;margin:14px 0 18px}
.nar{margin:0 0 12px;color:var(--cream)}
.think{font-style:italic;color:var(--muted);margin:0 0 12px;padding-left:14px;border-left:2px solid var(--line-hi)}
.quiet{color:var(--muted);font-size:15.5px;margin:4px 0 12px}
.say{margin:6px 0 14px;padding:14px 16px;border-radius:14px;background:rgba(243,234,214,.05);border:1px solid var(--line)}
.say .who{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:4px}
.say p{font-family:var(--serif);font-size:18.5px;line-height:1.45;font-weight:500}
.chat{margin:6px 0 12px;max-width:88%}
.chat .from{font-size:12px;color:var(--muted);margin:0 0 4px 4px;font-weight:600}
.chat .bubble{display:inline-block;padding:11px 15px;border-radius:4px 18px 18px 18px;background:#1d2d5c;border:1px solid var(--line);font-size:16.5px;line-height:1.45}
.cal{list-style:none;margin:4px 0 14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal li{padding:11px 16px;border-top:1px solid var(--line);font-size:16px;display:flex;gap:10px}
.cal li:first-child{border-top:0}
.cal li b{color:var(--gold);font-weight:600;min-width:76px}
.prompt{margin:22px 0 12px;font-size:12.5px;letter-spacing:.22em;color:var(--muted);font-weight:700;text-transform:uppercase}

.choices{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.choice{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:15px 16px 15px 14px;text-align:left;
  border-radius:var(--radius);border:1px solid var(--line);background:rgba(20,33,74,.72);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .3s,border-color .25s,background .25s}
.choice:not(:disabled):active{transform:scale(.985);background:var(--card-hi)}
.choice .letter{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;
  border:1px solid var(--line-hi);color:var(--muted);transition:background .25s,color .25s}
.choice .txt{flex:1;font-size:16.5px;line-height:1.4;font-weight:500}
.choice.picked{border-color:var(--gold);background:linear-gradient(180deg,rgba(228,185,95,.18),rgba(228,185,95,.06));transform:scale(1.02)}
.choice.picked .letter{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.choice.faded{opacity:.28}

/* ---------- outcome ---------- */
.picked-recap{padding:14px 16px;border-radius:14px;border:1px solid var(--gold-line);background:var(--gold-soft);margin:6px 0 22px}
.picked-recap .k{font-size:11.5px;letter-spacing:.2em;color:var(--gold);font-weight:700;text-transform:uppercase}
.picked-recap .t{font-weight:600;font-size:16px;line-height:1.4;margin-top:2px}
.outcome .blocks > *{animation:enter .5s both}
.outcome .blocks > *:nth-child(2){animation-delay:.12s}
.outcome .blocks > *:nth-child(3){animation-delay:.24s}
.outcome .blocks > *:nth-child(4){animation-delay:.36s}
.outcome .blocks > *:nth-child(n+5){animation-delay:.48s}
.spacer{flex:1;min-height:24px}

/* ---------- blackout / ending ---------- */
.blackout{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s ease;z-index:50}
.blackout.on{opacity:1;pointer-events:auto}
body.night{background:#05070f}
.ending{justify-content:center;padding:60px 4px 0}
.reveal > *{opacity:0;animation:rise .9s ease forwards;animation-delay:calc(var(--i) * .85s)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ending h1{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1.1;letter-spacing:.01em;margin-bottom:34px}
.ending p{font-size:19px;color:var(--muted);margin-bottom:14px}
.ending p.em{color:var(--cream);font-family:var(--serif);font-size:22px;line-height:1.4}
.ending .btn{margin-top:40px}

/* ---------- results ---------- */
.results{padding-top:12px}
.res-head{text-align:center;margin:8px 0 24px}
.res-head .eyebrow{display:block}
.res-head h2{font-family:var(--serif);font-size:30px;font-weight:500;margin-top:8px;line-height:1.2}
.spent{display:flex;align-items:center;gap:18px;padding:20px;border-radius:20px;border:1px solid var(--gold-line);background:var(--gold-soft);margin-bottom:14px}
.spent .big{font-family:var(--serif);font-size:56px;line-height:1;font-weight:700;min-width:84px;text-align:center}
.spent .big small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600;margin-top:6px}
.spent p{font-size:15.5px;line-height:1.5;color:var(--cream)}
.metric{padding:22px 20px;border-radius:20px;border:1px solid var(--line);background:rgba(20,33,74,.6);margin-bottom:14px}
.metric .lbl{font-size:12.5px;letter-spacing:.2em;font-weight:700;color:var(--gold)}
.metric .pct{font-family:var(--serif);font-size:64px;line-height:1;font-weight:700;margin:10px 0 12px}
.metric .pct sup{font-size:28px;vertical-align:top;margin-left:2px;color:var(--muted)}
.track{height:6px;border-radius:3px;background:rgba(243,234,214,.1);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#c99a3c,#f0c873);transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.metric .desc{color:var(--muted);font-size:15.5px;margin-top:14px;line-height:1.5}
.section-h{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:30px 0 14px}
.alloc{padding:18px 18px 8px;border-radius:20px;border:1px solid var(--line);background:rgba(20,33,74,.45)}
.alloc-row{margin-bottom:16px}
.alloc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.alloc-top span{font-size:14px;font-weight:700;letter-spacing:.06em}
.alloc-top b{font-family:var(--serif);font-size:22px}
.alloc-row .track{height:10px;border-radius:5px}
.alloc-row .track i{border-radius:5px}
.leftover{font-size:14.5px;color:var(--muted);padding:12px 0 10px;border-top:1px solid var(--line);margin-top:4px}
.leftover b{color:var(--cream)}
.insight{font-family:var(--serif);font-size:19.5px;line-height:1.5;font-weight:500;margin:0 0 12px}
.insight.soft{font-family:var(--sans);font-size:16px;color:var(--muted)}
details.recap{border:1px solid var(--line);border-radius:16px;margin-top:22px;overflow:hidden}
details.recap summary{list-style:none;min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;font-size:15px;cursor:pointer}
details.recap summary::-webkit-details-marker{display:none}
details.recap summary::after{content:"+";font-size:22px;color:var(--gold)}
details.recap[open] summary::after{content:"–"}
.recap ol{list-style:none;padding:0 18px 12px}
.recap li{padding:10px 0;border-top:1px solid var(--line);font-size:15px;display:flex;gap:12px}
.recap li .n{color:var(--gold);font-weight:700;min-width:22px}
.recap li .s{display:block;color:var(--dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.closing{text-align:center;margin:44px 0 6px}
.closing .big{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.2;margin-bottom:22px}
.closing p{color:var(--muted);margin-bottom:6px}
.closing .q{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--cream);line-height:1.4;margin:6px 0 20px}
.closing .q.gold{color:var(--gold);margin-bottom:30px}

/* ---------- reflect / final ---------- */
.reflect{justify-content:center;padding:56px 2px 0}
.reflect p{font-family:var(--serif);font-size:22px;line-height:1.45;font-weight:500;margin-bottom:20px}
.reflect p.muted{color:var(--muted)}
.reflect p.q{color:var(--gold);font-style:italic}
.final{justify-content:center;text-align:center;padding:40px 0 0}
.final .ref{font-family:var(--serif);font-weight:700;font-size:clamp(40px,13vw,58px);line-height:1.05;margin:20px 0 22px}
.final .theme{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.4;color:var(--cream);max-width:340px;margin:0 auto}
.final .rule{width:48px;height:2px;background:var(--gold);margin:30px auto}
.final .ask{color:var(--muted);font-size:16.5px;max-width:330px;margin:0 auto}
.final .foot{margin-top:auto;padding-top:40px;font-size:12px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}

/* ---------- menu sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:480px;margin:0 auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  background:#111c3c;border-radius:22px 22px 0 0;border:1px solid var(--line);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:6px}
.sheet p{color:var(--muted);font-size:15px;margin-bottom:18px}
.top-menu{display:flex;justify-content:flex-end;padding-top:calc(10px + env(safe-area-inset-top))}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}
  .reveal > *{opacity:1}
}
@media (max-width:370px){
  body{font-size:16px}
  .story-title{font-size:27px}
  .choice .txt{font-size:15.5px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="blackout" id="blackout"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menu"></div>

<script>
/* =========================================================
   100 KREDIT — game refleksi interaktif
   Pelkat PT GPIB · Ibadah 4 Oktober 2026
   Semua logika jalan di browser. Tanpa backend.

   ATURAN KREDIT:
   - Kredit tiap pilihan TIDAK ditampilkan ke pemain.
   - Makin besar kredit yang dipakai, makin dekat pilihan itu ke ibadah.
     Makin kecil, makin "duniawi".
   - Di tiap cerita, pilihan paling dekat ke ibadah = 10 kredit,
     jadi total maksimal 10 cerita = tepat 100 kredit.
   ========================================================= */

const SAVE_KEY = "100kredit_v2";

/* dimensi skor tersembunyi */
const KEYMAP = {
  cw: "consciousWorship", gr: "gratitude", st: "stewardship", lo: "love",
  in: "integrity", re: "responsibility", se: "service", sc: "selfCare"
};

const CATS = [
  { id: "church", label: "⛪ GEREJA & PT" },
  { id: "others", label: "👥 ORANG LAIN" },
  { id: "resp",   label: "📚 TANGGUNG JAWAB" },
  { id: "self",   label: "🎮 DIRI SENDIRI" }
];

let gameState = null;

function newState(name) {
  return {
    v: 2, name: name || "Teruna", section: 0, credits: 100,
    consciousWorship: 0, gratitude: 0, stewardship: 0, love: 0,
    integrity: 0, responsibility: 0, service: 0, selfCare: 0,
    allocations: { church: 0, others: 0, resp: 0, self: 0 },
    choices: [], finished: false
  };
}

/* pilihan pemain di cerita n (1–10) */
function ch(n) {
  const c = gameState && gameState.choices.find(x => x.s === n);
  return c ? c.key : null;
}

/* ---------- helper blok konten ---------- */
const P = t => ({ t: "p", text: t });
const SAY = (who, t) => ({ t: "say", who, text: t });
const CHAT = (from, t) => ({ t: "chat", from, text: t });
const THINK = t => ({ t: "think", text: t });
const QUIET = t => ({ t: "quiet", text: t });
const LIST = items => ({ t: "list", items });

/* Kak Rina ngomong langsung, atau lewat chat kalau pemain nggak ibadah */
const rina = (t) => ch(1) === "C" ? CHAT("Kak Rina", t) : SAY("Kak Rina", t);
const friend9 = () => ch(4) === "A" ? "Raka" : "Jojo";
const committed = () => ch(2) === "A" || ch(2) === "B";
const away8 = () => ch(7) === "D";

/* =========================================================
   DATA CERITA — 10 bagian
   cost : kredit (disembunyikan) — makin besar makin dekat ke ibadah
   fx   : skor tersembunyi
   alloc: kredit masuk ke kategori mana (jumlahnya = cost)
   ========================================================= */
const STORIES = [
/* ---------------- 01 ---------------- */
{
  day: "MINGGU", time: "08:10", title: "Minggu Pagi",
  intro: () => [
    P("Hari ini ada ibadah PT."),
    P("Kamu baru bangun. Semalem kamu begadang ngerjain tugas, dan mata masih berat banget."),
    P("HP-mu geter."),
    CHAT("Grup PT GPIB", "Guys, jangan lupa ibadah jam 9 ya 🙏"),
    CHAT("Jojo", "Bro, jadi kan nanti kita kerja kelompok jam 10?")
  ],
  choices: [
    { key: "A", text: "Berangkat ibadah PT.", cost: 8,
      fx: { cw: 10, gr: 4, sc: -2 }, alloc: { church: 8 },
      out: () => [
        P("Kamu mandi kilat terus langsung cabut. Nyampe gereja jam 08:56, napas masih ngos-ngosan."),
        P("Lagu pembuka mulai. Buat beberapa menit, notif di HP rasanya jauh banget."),
        P("Jam 10:20 kamu nyampe di rumah Jojo. Yang lain udah mulai duluan."),
        SAY("Jojo", "Santai, bagian lu tinggal slide terakhir kok."),
        QUIET("Kamu duduk dan mulai ngejar ketinggalan.")
      ] },
    { key: "B", text: "Kerja kelompok dulu, terus nyusul ibadah kalau sempat.", cost: 5,
      fx: { cw: 4, re: 5, lo: 3, gr: 1 }, alloc: { resp: 3, church: 2 },
      out: () => [
        P("Kalian mulai lebih pagi. Ternyata diskusinya lebih lama dari perkiraan."),
        P("Kamu nyampe gereja jam 10:05. Jemaat lagi berdiri buat terima berkat."),
        P("Kamu berdiri di deket pintu belakang. Beberapa temen PT dadah-dadah kecil ke kamu."),
        QUIET("Kamu cuma sempat ikut beberapa menit terakhir.")
      ] },
    { key: "C", text: "Nggak dateng. Kerja kelompok sampai beres.", cost: 2,
      fx: { re: 6, lo: 3, st: 2, sc: 2 }, alloc: { resp: 2 },

        P(`Kamu nelepon ${friend9()}. Kalian sepakat: kerja kelompok jam 1 siang, dan malam ini masing-masing ngerjain bagian kecil dulu.`),
        P("Rencananya jadi lebih masuk akal. Kamu tidur jam sebelas.")
      ] }
  ]
},
/* ---------------- 10 ---------------- */
{
  day: "MINGGU", time: "08:35", title: "Pilihan Terakhir",
  intro: () => [
    P(ch(9) === "C"
      ? `Kamu udah siap berangkat ke rumah ${friend9()} buat kerja kelompok.`
      : "Kamu udah siap berangkat ibadah."),
    P("Kamu masih punya waktu buat ngelakuin SATU hal sebelum berangkat.")
  ],
  choices: [
    { key: "A", text: () => ch(9) === "C" ? "Berdoa dan nyiapin hati sebelum mulai hari." : "Berdoa dan nyiapin hati buat ibadah.", cost: 10,
      fx: { cw: 10, gr: 5 }, alloc: { church: 10 } },
    { key: "B", text: "Bantu orang tua nyelesaiin kerjaan rumah.", cost: 8,
      fx: { lo: 5, se: 5, re: 2, gr: 2 }, alloc: { others: 8 } },
    { key: "C", text: "Nyicil tugas sekolah yang belum kelar.", cost: 5,
      fx: { re: 6, st: 3 }, alloc: { resp: 5 } },
    { key: "D", text: "Duduk, main HP, nikmatin waktu sendiri.", cost: 2,
      fx: { sc: 6 }, alloc: { self: 2 } }
  ]
}
];

/* =========================================================
   SKOR
   - Ibadah ritual = kredit yang masuk ke GEREJA & PT
     (ibadah, pelayanan, persembahan, doa, berani terbuka soal iman)
   - Ibadah aktual = kredit yang masuk ke ORANG LAIN + TANGGUNG JAWAB
     (dengerin teman, bantu orang tua, ngerjain PR, jujur, dll)
   Masing-masing dibandingkan dengan jumlah maksimal yang mungkin.
   Kredit DIRI SENDIRI tidak masuk ke dua-duanya.
   ========================================================= */
const RITUAL = ["church"], AKTUAL = ["others", "resp"];
const sumAlloc = (alloc, keys) => keys.reduce((a, k) => a + (alloc[k] || 0), 0);
const MAX_RITUAL = STORIES.reduce((a, s) => a + Math.max(...s.choices.map(c => sumAlloc(c.alloc, RITUAL))), 0);
const MAX_AKTUAL = STORIES.reduce((a, s) => a + Math.max(...s.choices.map(c => sumAlloc(c.alloc, AKTUAL))), 0);

function computeResults(st) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const alloc = {};
  CATS.forEach(c => alloc[c.id] = Math.round(st.allocations[c.id]));
  const ritual = clamp(Math.round(100 * sumAlloc(st.allocations, RITUAL) / MAX_RITUAL), 0, 100);
  const aktual = clamp(Math.round(100 * sumAlloc(st.allocations, AKTUAL) / MAX_AKTUAL), 0, 100);
  return { ritual, aktual, alloc, spent: 100 - st.credits, left: st.credits };
}

/* =========================================================
   SIMPAN PROGRES (opsional, gagal pun tidak apa-apa)
   ========================================================= */
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(gameState)); } catch (e) {} }
function load() { try { const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* =========================================================
   TAMPILAN
   ========================================================= */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fill = s => esc(s).replace(/\{name\}/g, esc(gameState ? gameState.name : "Teruna"));
const val = v => typeof v === "function" ? v() : v;
const pad = n => String(n).padStart(2, "0");

function blockHTML(b) {
  switch (b.t) {
    case "p": return `<p class="nar">${fill(b.text)}</p>`;
    case "think": return `<p class="think">${fill(b.text)}</p>`;
    case "quiet": return `<p class="quiet">${fill(b.text)}</p>`;
    case "say": return `<div class="say"><span class="who">${esc(b.who)}</span><p>“${fill(b.text)}”</p></div>`;
    case "chat": return `<div class="chat"><div class="from">${esc(b.from)}</div><div class="bubble">${fill(b.text)}</div></div>`;
    case "list": return `<ul class="cal">${b.items.map(i => `<li><b>${esc(i[0])}</b><span>${esc(i[1])}</span></li>`).join("")}</ul>`;
  }
  return "";
}

function mount(html, opts = {}) {
  $("#app").innerHTML = `<div class="screen">${html}</div>`;
  window.scrollTo(0, 0);
  document.body.classList.toggle("night", !!opts.night);
}

function hud(idx) {
  const dots = Array.from({ length: 10 }, (_, i) =>
    `<i class="${i < idx ? "on" : i === idx ? "now" : ""}"></i>`).join("");
  return `<header class="hud">
    <button class="icon-btn" aria-label="Menu" data-menu><span></span></button>
    <div class="hud-mid">
      <div class="hud-story">CERITA <b>${pad(idx + 1)}</b> / 10</div>
      <div class="dots">${dots}</div>
    </div>
  </header>`;
}

/* ---------- LAYAR 0: pembuka ---------- */
function renderLanding() {
  const saved = load();
  const canResume = saved && saved.v === 2 && !saved.finished && saved.section > 0 && saved.section <= 10;
  mount(`
    <div class="landing">
      <div class="coin"><b>100</b></div>
      <div class="logo">100<small>KREDIT</small></div>
      <p class="tagline">Semua yang dikasih ke kamu,<br>mau dipakai buat apa?</p>
      <div class="intro-copy">
        <p>Kamu punya <strong>100 kredit</strong>.<br>Itu waktumu, tenagamu, uangmu, perhatianmu, dan kesempatanmu.</p>
        <p>Kamu nggak bisa nyimpen semuanya selamanya.<br><strong>Kamu harus milih.</strong></p>
      </div>
      <div class="landing-actions">
        ${canResume ? `<button class="btn btn-primary" data-resume>LANJUTIN · CERITA ${pad(Math.min(saved.section + 1, 10))}</button>
                       <button class="btn btn-ghost" data-start>MULAI DARI AWAL</button>`
                    : `<button class="btn btn-primary" data-start>MULAI</button>`}
        <p class="fine">Main jujur aja, ya. Nggak ada jawaban yang paling bener.</p>
      </div>
    </div>`);
  $("[data-start]").onclick = () => { clearSave(); renderSetup(); };
  const r = $("[data-resume]");
  if (r) r.onclick = () => {
    gameState = saved;
    if (gameState.section >= 10) renderEnding(); else renderStory(gameState.section);
  };
}

/* ---------- LAYAR 1: nama ---------- */
function renderSetup() {
  mount(`
    <div class="setup">
      <span class="eyebrow">Sebelum mulai</span>
      <h2>Satu minggu dalam hidupmu.</h2>
      <label class="field-label" for="nameInput">Mau dipanggil siapa?</label>
      <input id="nameInput" class="name-input" type="text" maxlength="20" placeholder="Teruna" autocomplete="off" autocapitalize="words" enterkeyhint="done">
      <div class="credit-hero"><div class="lbl">KREDIT</div><div class="num">100</div>
        <div class="sub">Tiap pilihan bakal makan kredit. Berapa banyaknya? Kamu baru tahu di akhir.</div></div>
      <p class="week-lines"><span>Satu minggu.</span><span>Sepuluh pilihan.</span><span>Nggak ada jawaban yang sempurna.</span></p>
      <div class="spacer"></div>
      <button class="btn btn-primary" data-begin>GAS, MULAI</button>
    </div>`);
  const inp = $("#nameInput");
  const go = () => {
    const name = inp.value.trim().replace(/\s+/g, " ") || "Teruna";
    gameState = newState(name);
    save();
    renderStory(0);
  };
  $("[data-begin]").onclick = go;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { inp.blur(); go(); } });
}

/* ---------- LAYAR CERITA ---------- */
let locked = false;

function renderStory(idx) {
  locked = false;
  const s = STORIES[idx];
  const cards = s.choices.map((c, i) => `
    <button class="choice" data-i="${i}">
      <span class="letter">${c.key}</span>
      <span class="txt">${fill(val(c.text))}</span>
    </button>`).join("");

  mount(`${hud(idx)}
    <section class="story">
      <span class="when">${s.day} · ${val(s.time)}</span>
      <h2 class="story-title">${esc(s.title)}</h2>
      ${s.intro().map(blockHTML).join("")}
      <div class="prompt">Kamu mau ngapain?</div>
      <div class="choices">${cards}</div>
    </section>`);
  bindMenu();
  document.querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => choose(idx, +btn.dataset.i, btn), { once: true });
  });
}

function choose(idx, ci, btn) {
  if (locked) return;
  locked = true;
  const c = STORIES[idx].choices[ci];

  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b !== btn) b.classList.add("faded");
  });
  btn.classList.add("picked");

  // skor tersembunyi
  const fx = Object.assign({}, c.fx);
  if (c.mod) { const m = c.mod(); for (const k in m) fx[k] = (fx[k] || 0) + m[k]; }
  for (const k in fx) gameState[KEYMAP[k]] += fx[k];
  // kredit (diam-diam)
  const cost = Math.min(c.cost, gameState.credits);
  const factor = c.cost > 0 ? cost / c.cost : 0;
  for (const k in c.alloc) gameState.allocations[k] += c.alloc[k] * factor;
  gameState.credits -= cost;

  const label = val(c.text);
  gameState.choices.push({ s: idx + 1, key: c.key, label });
  gameState.section = idx + 1;
  save();

  setTimeout(() => {
    if (idx === 9) fadeToBlack(renderEnding);
    else renderOutcome(idx, c, label);
  }, 900);
}

function renderOutcome(idx, c, label) {
  const s = STORIES[idx];
  const blocks = c.out ? c.out() : [];
  mount(`${hud(idx)}
    <section class="story outcome">
      <span class="when">${s.day} · ${val(s.time)}</span>
      <h2 class="story-title">${esc(s.title)}</h2>
      <div class="picked-recap"><div class="k">Pilihanmu</div><div class="t">${fill(label)}</div></div>
      <div class="blocks">${blocks.map(blockHTML).join("")}</div>
      <div class="spacer"></div>
      <button class="btn btn-primary" data-next>LANJUT →</button>
    </section>`);
  const dots = document.querySelectorAll(".dots i");
  if (dots[idx]) dots[idx].className = "on";
  bindMenu();
  $("[data-next]").onclick = () => renderStory(idx + 1);
}

function fadeToBlack(next) {
  const bo = $("#blackout");
  bo.classList.add("on");
  setTimeout(() => { next(); setTimeout(() => bo.classList.remove("on"), 120); }, 1400);
}

const stagger = lines => lines.map((l, i) => l.replace(/^<(\w+)/, `<$1 style="--i:${i}"`)).join("");

/* ---------- AKHIR MINGGU ---------- */
function renderEnding() {
  mount(`<div class="ending reveal">${stagger([
    `<h1>MINGGUNYA<br>UDAH SELESAI.</h1>`,
    `<p>Kamu mulai dengan 100 kredit.</p>`,
    `<p>Kamu nggak bisa nyimpen semuanya.</p>`,
    `<p class="em">Kamu harus milih.</p>`,
    `<p class="em">Kamu harus nentuin prioritas.</p>`,
    `<p>Kamu harus mutusin: apa yang layak dapet waktu, uang, tenaga, dan perhatianmu.</p>`,
    `<button class="btn btn-primary" data-results>LIHAT MINGGUMU</button>`
  ])}</div>`, { night: true });
  $("[data-results]").onclick = renderResults;
}

/* ---------- HASIL ---------- */
function renderResults() {
  gameState.finished = true;
  save();
  const r = computeResults(gameState);
  const maxA = Math.max(1, ...Object.values(r.alloc));
  const topCat = CATS.map(c => c.id).sort((a, b) => r.alloc[b] - r.alloc[a])[0];

  const flow = {
    church: "Minggu ini, kreditmu paling banyak ngalir ke gereja dan PT.",
    others: "Minggu ini, kreditmu paling banyak ngalir ke orang-orang di sekitarmu.",
    resp: "Minggu ini, kreditmu paling banyak ngalir ke tanggung jawabmu.",
    self: "Minggu ini, kreditmu paling banyak kamu pakai buat diri sendiri: istirahat, seneng-seneng, waktu pribadi."
  }[topCat];

  let gap;
  if (r.ritual - r.aktual >= 15) {
    gap = "Ibadah ritualmu kuat: kamu dateng, ikut pelayanan, berdoa. Coba pikirin juga: gimana ibadahmu di hari Senin sampai Sabtu, di rumah, di sekolah, sama temen?";
  } else if (r.aktual - r.ritual >= 15) {
    gap = "Banyak kreditmu kepake buat hal sehari-hari: dengerin temen, bantu orang lain, beresin tanggung jawab. Itu juga ibadah. Tapi gimana dengan waktu khusus buat Tuhan: ibadah, doa, saat teduh?";
  } else {
    gap = "Ibadah ritual dan ibadah aktualmu jalannya cukup seimbang. Pertanyaannya tetap sama buat semua orang: semua itu kamu lakukan sebagai apa?";
  }

  const recap = gameState.choices.map(c =>
    `<li><span class="n">${pad(c.s)}</span><span><span class="s">${esc(STORIES[c.s - 1].title.replace(/[“”]/g, ""))}</span>${fill(c.label)}</span></li>`).join("");

  mount(`
    <div class="top-menu"><button class="icon-btn" aria-label="Menu" data-menu><span></span></button></div>
    <section class="results">
      <div class="res-head"><span class="eyebrow">Minggunya</span><h2>${esc(gameState.name)}</h2></div>

      <div class="metric">
        <div class="lbl">⛪ IBADAH RITUAL</div>
        <div class="pct"><span data-count="${r.ritual}">0</span><sup>%</sup></div>
        <div class="track"><i data-w="${r.ritual}"></i></div>
        <p class="desc">Ibadah di gereja dan waktu khusus sama Tuhan: dateng ke PT, pelayanan, persembahan, doa, saat teduh.</p>
      </div>
      <div class="metric">
        <div class="lbl">🌱 IBADAH AKTUAL</div>
        <div class="pct"><span data-count="${r.aktual}">0</span><sup>%</sup></div>
        <div class="track"><i data-w="${r.aktual}"></i></div>
        <p class="desc">Ibadah lewat hidup sehari-hari: dengerin temen, bantu orang tua, ngerjain PR, jujur, peduli sama orang lain.</p>
      </div>
      <p class="insight soft" style="margin:4px 2px 0">Kamu pakai <b style="color:var(--cream)">${r.spent} dari 100 kredit</b>. Diam-diam, tiap pilihan makan kredit yang beda: makin banyak kredit yang kamu kasih, makin dekat pilihan itu ke ibadah, entah ritual atau aktual.</p>

      <div class="section-h">Kreditmu ke mana aja</div>
      <div class="alloc">
        ${CATS.map(c => `<div class="alloc-row">
          <div class="alloc-top"><span>${c.label}</span><b>${r.alloc[c.id]}</b></div>
          <div class="track"><i data-w="${Math.round(100 * r.alloc[c.id] / maxA)}"></i></div>
        </div>`).join("")}
        <div class="leftover">Kredit yang nggak kepake: <b>${r.left}</b>. Kredit ini nggak bisa dibawa ke minggu depan.</div>
      </div>

      <div class="section-h">Catatan buat kamu</div>
      <p class="insight">${flow}</p>
      <p class="insight soft">${gap}</p>

      <details class="recap"><summary>Lihat 10 pilihanmu</summary><ol>${recap}</ol></details>

      <div class="closing">
        <p class="big">Nggak ada skor yang sempurna.</p>
        <p>Karena pertanyaannya bukan:</p>
        <p class="q">“Aku udah cukup baik belum?”</p>
        <p>Tapi:</p>
        <p class="q gold">“Apa yang kamu lakukan dengan apa yang Tuhan percayakan ke kamu?”</p>
        <button class="btn btn-primary" data-reflect>RENUNGKAN</button>
      </div>
    </section>`);
  bindMenu();

  requestAnimationFrame(() => setTimeout(() => {
    document.querySelectorAll("[data-w]").forEach(el => el.style.width = el.dataset.w + "%");
    document.querySelectorAll("[data-count]").forEach(el => {
      const to = +el.dataset.count, t0 = performance.now();
      const step = now => {
        const p = Math.min(1, (now - t0) / 1300);
        el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }, 150));
  $("[data-reflect]").onclick = renderReflect;
}

/* ---------- RENUNGAN ---------- */
function renderReflect() {
  mount(`<div class="reflect reveal">${stagger([
    `<p>Selama main tadi, kamu udah pakai waktu, uang, tenaga, perhatian, dan kesempatanmu.</p>`,
    `<p class="muted">Semuanya terbatas.</p>`,
    `<p>Dan semuanya itu dipercayakan ke kamu.</p>`,
    `<p class="q">Apa ibadah cuma yang ritual, waktu kamu ada di gereja?</p>`,
    `<p class="q">Atau cara kamu ngejalanin hidup sehari-hari juga ibadah, responsmu ke Tuhan?</p>`,
    `<button class="btn btn-primary" data-sermon>SEKARANG, KITA BAHAS</button>`
  ])}</div>`, { night: true });
  $("[data-sermon]").onclick = renderFinal;
}

/* ---------- PENUTUP: khotbah dimulai ---------- */
function renderFinal() {
  mount(`
    <div class="final">
      <span class="eyebrow">Bacaan Alkitab</span>
      <div class="ref">2 TAWARIKH<br>1:1–6</div>
      <p class="theme">Beribadah sebagai Wujud Kasih dan Syukur kepada Tuhan</p>
      <div class="rule"></div>
      <p class="ask">Gimana kita makai apa yang Tuhan percayakan ke kita sebagai wujud kasih dan syukur kepada Tuhan?</p>
      <p class="foot">Pelkat PT GPIB · 4 Oktober 2026</p>
    </div>`, { night: true });
}

/* ---------- MENU ---------- */
function bindMenu() {
  document.querySelectorAll("[data-menu]").forEach(b => b.onclick = openMenu);
}
function openMenu() {
  const sheet = $("#sheet"), bg = $("#sheetBg");
  sheet.innerHTML = `
    <h3>Menu</h3>
    <p>Progresmu kesimpen di HP ini. Kalau mulai ulang, semua pilihanmu bakal kehapus.</p>
    <button class="btn btn-ghost" data-restart>MULAI ULANG</button>
    <button class="btn btn-primary" data-close>BALIK KE GAME</button>`;
  sheet.classList.add("on"); bg.classList.add("on");
  const close = () => { sheet.classList.remove("on"); bg.classList.remove("on"); };
  bg.onclick = close;
  sheet.querySelector("[data-close]").onclick = close;
  const rb = sheet.querySelector("[data-restart]");
  rb.onclick = () => {
    if (rb.dataset.confirm) {
      close(); clearSave(); gameState = null; renderLanding();
    } else {
      rb.dataset.confirm = "1";
      rb.textContent = "YAKIN? TAP SEKALI LAGI";
      rb.style.borderColor = "var(--gold)";
      rb.style.color = "var(--gold)";
    }
  };
}

/* ---------- mulai ---------- */
if (typeof document !== "undefined" && document.getElementById("app")) renderLanding();
if (typeof module !== "undefined") module.exports = { STORIES, newState, computeResults, MAX_RITUAL, MAX_AKTUAL, KEYMAP, setState: s => { gameState = s; } };
</script>
